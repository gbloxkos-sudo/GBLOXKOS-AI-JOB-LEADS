[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gbloxkos-ai-job-leads"
version = "0.14.16"
description = "AI-powered job search and application tracking assistant by GBLOXKOS LLC"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "GBLOXKOS LLC", email = "dev@gbloxkos.com"},
]
keywords = ["job-search", "ai", "ollama", "fastapi", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/GBLOXKOS-LLC/gbloxkos-ai-job-leads"
Repository = "https://github.com/GBLOXKOS-LLC/gbloxkos-ai-job-leads.git"
Issues = "https://github.com/GBLOXKOS-LLC/gbloxkos-ai-job-leads/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html"]
